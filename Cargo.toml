[package]
name = "claude-code-setup"
version = "0.1.0"
edition = "2021"
authors = ["Ercan ER <ercaner1988@gmail.com>", "Kassam <agent@hermes.local>"]
description = "Rust port of Claude Code Complete Setup & Diagnostics CLI"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.1"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
rusqlite = { version = "0.31", features = ["bundled"] }
fastembed = { version = "4.9", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.8"
