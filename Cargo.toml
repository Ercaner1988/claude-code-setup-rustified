[package]
name = "claude-code-setup"
version = "0.1.6"
edition = "2021"
authors = ["Ercan ER <ercaner1988@gmail.com>", "Kassam <agent@hermes.local>"]
description = "Bagimsiz Rust CLI: Claude Code ortam denetimi, dinamik MCP yonetimi, semantik + graf hafiza motoru"
license = "MIT"
repository = "https://github.com/Ercaner1988/claude-code-setup-rustified"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.1"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
fastembed = { version = "4.9", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }
regex = "1.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.8"
