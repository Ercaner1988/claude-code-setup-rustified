name: Release

# Her PR'da da calisir (kuru kosu): yayinlanacak artefakti ayni yoldan
# derleyip paketler ve gercekten calistirir. Yukleme adimi yalnizca v*
# etiketinde isler. Boylece bozuk bir paket etiketlenmeden yakalanir.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: claude-code-setup-linux-x86_64
            mcpb: claude-code-setup-linux.mcpb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: claude-code-setup-windows-x86_64.exe
            mcpb: claude-code-setup-windows.mcpb
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: claude-code-setup-macos-x86_64
            mcpb: claude-code-setup-macos.mcpb
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # ubuntu-latest'te `python` komutu yok, yalnizca `python3`.
      # setup-python her platformda `python` saglar.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage asset (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/claude-code-setup ${{ matrix.asset }}

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item target/${{ matrix.target }}/release/claude-code-setup.exe ${{ matrix.asset }}

      - name: Validate manifest against official MCPB schema
        run: npx --yes @anthropic-ai/mcpb@latest validate manifest.json

      - name: Package Claude Desktop extension
        run: python package-extension.py ${{ matrix.asset }} ${{ matrix.mcpb }}

      # Yayinlanacak paketi Claude Desktop'in yapacagi gibi ac ve calistir:
      # isletim sisteminin kendi unzip'i (calistirma izni ancak boyle sinanir),
      # MCP el sikismasi, arac listesi, salt-okunur bir aracin gercek cagrisi.
      # macOS koşucusu ARM; x86_64 ikili burada yalnizca Rosetta ile calisir,
      # bu adim o yuzden "Apple Silicon Mac'te calisiyor mu"nun da cevabi.
      - name: Smoke test packaged extension
        run: python smoke-test-extension.py ${{ matrix.mcpb }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.mcpb }}
