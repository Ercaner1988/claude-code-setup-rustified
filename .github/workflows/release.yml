name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: claude-code-setup-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: claude-code-setup-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: claude-code-setup-macos-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage asset (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/claude-code-setup ${{ matrix.asset }}

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item target/${{ matrix.target }}/release/claude-code-setup.exe ${{ matrix.asset }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
